name: Update data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  push:
    branches:
      - main

concurrency:
  group: data-pages-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    outputs:
      data_hash: ${{ steps.hash.outputs.data_hash }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate data snapshot
        if: github.event_name != 'push' && env.FOOTBALL_DATA_TOKEN != ''
        run: npm run fetch:data
      - name: Use committed data snapshot
        if: github.event_name == 'push'
        run: |
          echo "::notice::Push builds use committed public/data/latest.json; scheduled/manual runs refresh data"
      - name: Require token for scheduled data refresh
        if: github.event_name != 'push' && env.FOOTBALL_DATA_TOKEN == ''
        run: |
          echo "::error::FOOTBALL_DATA_TOKEN is required for scheduled or manual real data refresh"
          exit 1
      - run: npm run validate:data
      - id: hash
        run: echo "data_hash=$(sha256sum public/data/latest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Commit data changes
        if: github.event_name != 'push'
        run: |
          if [[ -n "$(git status --porcelain public/data public/assets)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data public/assets
            git commit -m "chore: update football data"
            git pull --rebase origin main
            git push
          fi
      - name: Step summary
        run: |
          {
            echo "## Data update"
            echo "- Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Leagues: $(node -e "console.log(require('./public/data/latest.json').leagues.length)")"
            echo "- Hash: ${{ steps.hash.outputs.data_hash }}"
            node -e "const data=require('./public/data/latest.json'); console.log('- Outright odds:'); for (const league of data.leagues) { const quality=league.odds?.dataQuality; console.log('  - '+league.name+': '+(league.odds?.teams?.length ?? 0)+' teams, coverage='+(quality ? Math.round(quality.coverageRatio*100)+'%' : 'n/a')); } console.log('- Match odds:'); for (const league of data.leagues) { const quality=league.matchOdds?.dataQuality; console.log('  - '+league.name+': '+(league.matchOdds?.matches?.length ?? 0)+' matches, coverage='+(quality ? Math.round(quality.coverageRatio*100)+'%' : 'n/a')); }"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: fetch
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
