name: Update data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14,20 * * *'
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-pages-main
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    outputs:
      data_hash: ${{ steps.hash.outputs.data_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate data snapshot
        if: env.FOOTBALL_DATA_TOKEN != ''
        run: npm run fetch:data
      - name: Use committed data snapshot
        if: env.FOOTBALL_DATA_TOKEN == '' && github.event_name == 'push'
        run: |
          echo "::warning::FOOTBALL_DATA_TOKEN is not configured; using committed public/data/latest.json"
      - name: Require token for scheduled data refresh
        if: env.FOOTBALL_DATA_TOKEN == '' && github.event_name != 'push'
        run: |
          echo "::error::FOOTBALL_DATA_TOKEN is required for scheduled or manual real data refresh"
          exit 1
      - run: npm run validate:data
      - id: hash
        run: echo "data_hash=$(sha256sum public/data/latest.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Commit data changes
        run: |
          if [[ -n "$(git status --porcelain public/data)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data
            git commit -m "chore: update football data"
            git push
          fi
      - name: Step summary
        run: |
          {
            echo "## Data update"
            echo "- Time: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Leagues: $(node -e "console.log(require('./public/data/latest.json').leagues.length)")"
            echo "- Hash: ${{ steps.hash.outputs.data_hash }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: fetch
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
